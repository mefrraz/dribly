name: regenerate-sitemap

on:
  schedule:
    - cron: '0 3 * * 1'   # every Monday at 3am UTC
  workflow_dispatch:       # manual trigger

jobs:
  sitemap:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: web
        run: npm install --no-save

      - name: Generate sitemap
        working-directory: web
        run: npm run sitemap

      - name: Commit & push sitemap
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git stash
          git pull --rebase origin main
          git stash pop
          git add web/public/sitemap.xml
          if git diff --staged --quiet; then
            echo "No changes to sitemap"
          else
            git commit -m "chore: regenerate sitemap.xml [skip ci]"
            git push
          fi
